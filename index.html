<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List Life Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-theme="light">

    <header>
      <button id="theme-toggle" aria-label="Toggle dark mode">🌙</button>
    </header>

    <main>

      <!-- ── Greeting Widget ── -->
      <section id="greeting-widget" aria-label="Greeting">
        <p id="greeting-time" aria-live="polite"></p>
        <p id="greeting-date"></p>
        <p id="greeting-message" aria-live="polite"></p>
      </section>

      <!-- ── Focus Timer Widget ── -->
      <section id="timer-widget" aria-label="Focus Timer">
        <h2>Focus Timer</h2>

        <div id="timer-display" aria-live="polite" aria-label="Timer display">00:00</div>

        <div class="timer-controls">
          <button id="timer-start" type="button">Start</button>
          <button id="timer-stop" type="button">Stop</button>
          <button id="timer-reset" type="button">Reset</button>
        </div>

        <div class="timer-duration-row">
          <label for="timer-duration">Duration (minutes):</label>
          <input
            id="timer-duration"
            type="number"
            min="1"
            max="120"
            step="1"
            value="25"
            aria-describedby="timer-duration-error"
          />
          <p id="timer-duration-error" class="validation-message" role="alert" aria-live="polite"></p>
        </div>
      </section>

      <!-- ── Task Manager Widget ── -->
      <section id="task-widget" aria-label="Task Manager">
        <h2>Tasks</h2>

        <form id="task-form" novalidate>
          <label for="task-input" class="sr-only">New task description</label>
          <input
            id="task-input"
            type="text"
            placeholder="Add a new task…"
            maxlength="201"
            autocomplete="off"
            aria-describedby="task-input-error"
          />
          <button type="submit">Add</button>
        </form>
        <p id="task-input-error" class="validation-message" role="alert" aria-live="polite"></p>

        <div class="task-sort-row">
          <label for="sort-select">Sort:</label>
          <select id="sort-select" aria-label="Sort tasks">
            <option value="default">Default</option>
            <option value="alpha-asc">A → Z</option>
            <option value="alpha-desc">Z → A</option>
            <option value="incomplete">Incomplete first</option>
            <option value="completed">Completed first</option>
          </select>
        </div>

        <ul id="task-list" aria-label="Task list" aria-live="polite"></ul>
      </section>

      <!-- ── Quick Links Widget ── -->
      <section id="links-widget" aria-label="Quick Links">
        <h2>Quick Links</h2>

        <form id="links-form" novalidate>
          <div class="links-form-field">
            <label for="link-label">Label:</label>
            <input
              id="link-label"
              type="text"
              placeholder="e.g. GitHub"
              maxlength="51"
              autocomplete="off"
              aria-describedby="link-label-error"
            />
            <p id="link-label-error" class="validation-message" role="alert" aria-live="polite"></p>
          </div>

          <div class="links-form-field">
            <label for="link-url">URL:</label>
            <input
              id="link-url"
              type="url"
              placeholder="https://example.com"
              maxlength="2049"
              autocomplete="off"
              aria-describedby="link-url-error"
            />
            <p id="link-url-error" class="validation-message" role="alert" aria-live="polite"></p>
          </div>

          <button type="submit">Add Link</button>
        </form>

        <div id="links-list" aria-label="Saved links" aria-live="polite"></div>
      </section>

    </main>

    <div id="storage-banner" class="storage-banner" hidden>Data cannot be saved — storage is unavailable.</div>

    <script defer src="js/app.js"></script>
  </body>
</html>
